<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAINZOPE | Page Redirect</title>
  <script>
    // Preserve recognised SPA routes on static hosts that serve this 404 file.
    // The app restores the requested URL from the route query parameter.
    var path = window.location.pathname.replace(/\/+$/, '') || '/';
    var routes = [
      '/about',
      '/privacy',
      '/terms',
      '/reward-terms',
      '/spin-rules',
      '/refund-cancellation',
      '/support',
      '/account-deletion'
    ];
    if (routes.indexOf(path) !== -1) {
      window.location.replace('/?route=' + encodeURIComponent(path) + window.location.hash);
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body style="margin:0;min-height:100vh;background:#10110e;color:#f5f4ef;font-family:sans-serif;display:grid;place-items:center;text-align:center;">
  <div>
    <h1 style="font-size:2rem;margin-bottom:0.5rem;">Redirecting to GAINZOPE...</h1>
    <p style="color:#aeb2a7;">If you are not redirected automatically, <a href="/" style="color:#c8ff00;">click here to return to Home</a>.</p>
  </div>
</body>
</html>
